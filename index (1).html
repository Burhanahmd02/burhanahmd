        // Web Audio API Beep Generator for Timers and Reminders
        const playBeep = (freq = 600, duration = 0.15, type = 'sine') => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio play blocked or not supported", e);
            }
        };

        function ExerciseImage({ src, category, alt, className = "w-full h-full object-cover" }) {
            const fallbackSrc = CATEGORY_IMAGES[category] || CATEGORY_IMAGES['Kardio'];
            const [imgSrc, setImgSrc] = React.useState(src || fallbackSrc);

            React.useEffect(() => {
                setImgSrc(src || fallbackSrc);
            }, [src, category]);

            return (
                <img 
                    src={imgSrc} 
                    alt={alt || "Ilustrasi Visual"} 
                    onError={() => setImgSrc(fallbackSrc)} 
                    class={className}
                    loading="lazy"
                />
            );
        }

                localStorage.setItem('ahmd_reminders', JSON.stringify(reminders));
            }, [reminders]);

            React.useEffect(() => {
                localStorage.setItem('ahmd_history', JSON.stringify(workoutHistory));

            });

                    const now = new Date();
                    const currentHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                    if (now.getSeconds() === 0) {
                        reminders.forEach(rem => {
                            if (rem.active && rem.time === currentHM) {
                                playBeep(880, 0.5, 'triangle');
                                triggerNotification(rem.title, rem.note);
                            }
                        });
                    }
                }, 1000);
                return () => clearInterval(interval);
            }, [reminders]);

            const triggerNotification = (title, body) => {
                if ("Notification" in window) {
                    if (Notification.permission === "granted") {
                        new Notification(`⏰ AhmdFIT Reminder: ${title}`, { body, icon: 'https://cdn-icons-png.flaticon.com/512/2964/2964514.png' });
                    } else if (Notification.permission !== "denied") {
                        Notification.requestPermission().then(permission => {

                        });

                    return updated;

        function MealsView({ todayFoodLog, setTodayFoodLog, userProfile, totalConsumedCalories }) {

            const [mealType, setMealType] = React.useState('Makan Siang');

            const addCustomMeal = (e) => {
                e.preventDefault();
                if (!customFoodName.trim() || !customCalories) return;
                const newFood = {
                    id: 'custom_meal_' + Date.now(),
                    name: customFoodName,
                    calories: parseInt(customCalories),
                    protein: 15,
                    carbs: 30,
                    fat: 8,
                    mealType,
                    image: CATEGORY_IMAGES['Makanan'],
                    desc: 'Makanan kustom tambahan harian.'
                };
                setTodayFoodLog(prev => [...prev, newFood]);
                setCustomFoodName('');
                setCustomCalories('');
                playBeep(600, 0.15, 'sine');
            };

            const addMealFromPreset = (item) => {
                const newFood = {
                    ...item,
                    id: 'preset_meal_' + Date.now() + Math.random()
                };
                setTodayFoodLog(prev => [...prev, newFood]);
                playBeep(700, 0.15, 'sine');
            };

            const deleteFoodLog = (id) => {
                setTodayFoodLog(prev => prev.filter(f => f.id !== id));

            const targetCal = userProfile.targetCalories || 2000;
            const percentage = Math.min(Math.round((totalConsumedCalories / targetCal) * 100), 100);

            return (
                <div class="space-y-6">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">

                            </div>
                            <span class="text-lg font-black text-blue-400 font-mono">{percentage}%</span>
                        </div>

                        <div class="w-full bg-slate-950 h-3.5 rounded-full overflow-hidden border border-slate-800">

                        </div>
                    </div>

                    {/* Input Custom Food Form */}

                    <form onSubmit={addCustomMeal} class="bg-slate-900 border border-slate-800 p-5 rounded-3xl space-y-3">
                        <h3 class="text-sm font-bold text-white flex items-center gap-2">
                            <i data-lucide="plus-circle" class="w-4 h-4 text-blue-400"></i>
                            Catat Makanan Lainnya (Kustom)
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <input 
                                type="text" 
                                placeholder="Nama makanan (misal: Nasi Goreng Telur)..."
                                value={customFoodName}
                                onChange={(e) => setCustomFoodName(e.target.value)}

                            />
                            <input 
                                type="number" 
                                placeholder="Jumlah Kalori (kcal)..."

                                onChange={(e) => setCustomCalories(e.target.value)}

                            />
                            <select

                    </div>

                    {/* Preset Diet Meal Plans Recommendations */}

                                        </span>

                                        <div class="mt-4 space-y-3">

                                                    <div class="flex items-center gap-3 min-w-0">
                                                        <div class="w-11 h-11 rounded-xl overflow-hidden bg-slate-900 shrink-0 border border-slate-800">
                                                            <ExerciseImage src={m.image} category="Makanan" alt={m.name} />
                                                        </div>
                                                        <div class="truncate">
                                                            <p class="text-xs font-bold text-white truncate">{m.name}</p>

        function RemindersView({ reminders, setReminders, triggerNotification }) {
            const [time, setTime] = React.useState('06:30');
            const [title, setTitle] = React.useState('');
            const [note, setNote] = React.useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if (!title.trim()) return;
                const newRem = {
                    id: 'rem_' + Date.now(),
                    title,
                    time,
                    active: true,
                    note: note || 'Waktunya olahraga AhmdFIT!'
                };
                setReminders(prev => [...prev, newRem]);
                setTitle('');
                setNote('');
                playBeep(800, 0.2, 'sine');
            };

            const toggleActive = (id) => {
                setReminders(prev => prev.map(r => r.id === id ? { ...r, active: !r.active } : r));
            };

            const deleteReminder = (id) => {
                setReminders(prev => prev.filter(r => r.id !== id));
            };

            return (
                <div class="space-y-6">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                        <h2 class="text-xl font-extrabold text-white mb-1">Pengingat & Alarm Olahraga</h2>
                        <p class="text-xs text-slate-400">Atur jadwal alarm otomatis agar kamu tidak pernah melewatkan waktu latihan.</p>
                    </div>

                    <div class="bg-gradient-to-r from-blue-900/40 to-slate-900 border border-blue-800/50 p-4 rounded-2xl flex items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <i data-lucide="bell-ring" class="w-5 h-5 text-blue-400"></i>
                            <div>
                                <p class="text-sm font-bold text-white">Izin Notifikasi Browser</p>
                                <p class="text-xs text-slate-400">Aktifkan notifikasi untuk menerima pengingat saat aplikasi terbuka.</p>
                            </div>
                        </div>
                        <button 
                            onClick={() => triggerNotification("Tes Pengingat AhmdFIT", "Notifikasi aktif sempurna!")}
                            class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shrink-0 transition"
                        >
                            Tes Notifikasi
                        </button>
                    </div>

                    <form onSubmit={handleAdd} class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4">
                        <h3 class="text-sm font-bold text-white">Tambah Jadwal Pengingat Baru</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div>
                                <label class="text-xs text-slate-400 mb-1 block">Waktu Alarm</label>
                                <input 
                                    type="time" 
                                    value={time}
                                    onChange={(e) => setTime(e.target.value)}
                                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                                />
                            </div>
                            <div>
                                <label class="text-xs text-slate-400 mb-1 block">Nama Sesi Olahraga</label>
                                <input 
                                    type="text" 
                                    placeholder="Contoh: Jogging Pagi AhmdFIT" 
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500"
                                />
                            </div>
                            <div>
                                <label class="text-xs text-slate-400 mb-1 block">Catatan Tambahan</label>
                                <input 
                                    type="text" 
                                    placeholder="Contoh: Pakai sepatu lari & minum air hangat" 
                                    value={note}
                                    onChange={(e) => setNote(e.target.value)}
                                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500"
                                />
                            </div>
                        </div>
                        <button 
                            type="submit"
                            class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2"
                        >
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            Simpan Pengingat
                        </button>
                    </form>

                    <div class="space-y-3">
                        {reminders.map((rem) => (
                            <div key={rem.id} class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex items-center justify-between gap-4">
                                <div class="flex items-center gap-4">
                                    <div class="text-2xl font-black text-blue-400 font-mono bg-slate-950 px-3 py-2 rounded-xl border border-slate-800">
                                        {rem.time}
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-white text-base">{rem.title}</h4>
                                        <p class="text-xs text-slate-400">{rem.note}</p>
                                    </div>
                                </div>

                                <div class="flex items-center gap-3">
                                    <button 
                                        onClick={() => toggleActive(rem.id)}

                                        {rem.active ? 'Aktif' : 'Mati'}

                                </div>
                            </div>
                        ))}

                </div>
            );
        }

        function ProgressAnalyticsView({ workoutHistory, weightLogs, setWeightLogs, userProfile, totalConsumedCalories, totalBurnedCalories }) {
            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);

            const [newWeight, setNewWeight] = React.useState('');

            React.useEffect(() => {
                if (!chartRef.current) return;

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: workoutHistory.map(h => h.date),
                        datasets: [{
                            label: 'Kalori Terbakar (kcal)',
                            data: workoutHistory.map(h => h.calories),
                            backgroundColor: '#3b82f6',
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { labels: { color: '#94a3b8' } }
                        },
                        scales: {
                            x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
                            y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [workoutHistory]);

            const handleAddWeight = (e) => {
                e.preventDefault();
                if (!newWeight || isNaN(newWeight)) return;
                const todayStr = new Date().toISOString().split('T')[0];
                setWeightLogs(prev => [...prev, { date: todayStr, weight: parseFloat(newWeight) }]);
                setNewWeight('');
            };

            return (
                <div class="space-y-6">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                        <h2 class="text-xl font-extrabold text-white mb-1">Hasil Progres & Analisis AhmdFIT</h2>
                        <p class="text-xs text-slate-400">Pantau statistik latihan harian, kalori terbakar, dan riwayat berat badanmu.</p>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4">
                        <h3 class="text-sm font-bold text-white">Grafik Kalori Terbakar Olahraga</h3>
                        <div class="w-full h-64">
                            <canvas ref={chartRef}></canvas>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Weight Tracker Section */}
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4">
                            <h3 class="text-sm font-bold text-white">Catat Berat Badan Terbaru</h3>
                            <form onSubmit={handleAddWeight} class="flex gap-2">
                                <input 
                                    type="number" 
                                    step="0.1"
                                    placeholder="Berat (kg)..."
                                    value={newWeight}
                                    onChange={(e) => setNewWeight(e.target.value)}
                                    class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                                />
                                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition">
                                    Simpan Log
                                </button>
                            </form>

                            <div class="space-y-2 mt-4 max-h-48 overflow-y-auto">
                                {weightLogs.slice().reverse().map((log, idx) => (
                                    <div key={idx} class="flex justify-between items-center text-xs p-3 bg-slate-950 rounded-xl border border-slate-800">
                                        <span class="text-slate-400">{log.date}</span>
                                        <span class="font-bold text-white">{log.weight} kg</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Summary Badges */}
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 flex flex-col justify-between">
                            <div>
                                <h3 class="text-sm font-bold text-white mb-2">Pencapaian & Milestone</h3>
                                <p class="text-xs text-slate-400">Setiap sesi mendekatkanmu ke bentuk tubuh impian!</p>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 text-center">
                                    <i data-lucide="trophy" class="w-6 h-6 text-amber-400 mx-auto mb-1"></i>
                                    <p class="text-lg font-black text-white">{workoutHistory.length}</p>
                                    <p class="text-[11px] text-slate-400">Sesi Latihan Selesai</p>
                                </div>
                                <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 text-center">
                                    <i data-lucide="flame" class="w-6 h-6 text-orange-500 mx-auto mb-1"></i>
                                    <p class="text-lg font-black text-white">
                                        {workoutHistory.reduce((acc, curr) => acc + (curr.calories || 0), 0)}
                                    </p>
                                    <p class="text-[11px] text-slate-400">Total Kalori Terbakar</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ProfileCalculatorView({ userProfile, setUserProfile }) {
            const [name, setName] = React.useState(userProfile.name);
            const [weight, setWeight] = React.useState(userProfile.weight);
            const [height, setHeight] = React.useState(userProfile.height);
            const [age, setAge] = React.useState(userProfile.age);
            const [targetCalories, setTargetCalories] = React.useState(userProfile.targetCalories || 2000);

            const handleSave = (e) => {
                e.preventDefault();
                setUserProfile(prev => ({
                    ...prev,
                    name,
                    weight: parseFloat(weight),
                    height: parseFloat(height),
                    age: parseInt(age),
                    targetCalories: parseInt(targetCalories)
                }));
                playBeep(700, 0.15, 'sine');
                alert('Profil AhmdFIT berhasil diperbarui!');
            };

            const heightInMeters = height / 100;
            const bmi = heightInMeters > 0 ? (weight / (heightInMeters * heightInMeters)).toFixed(1) : 0;

            let bmiCategory = 'Normal';
            let bmiColor = 'text-blue-400';
            if (bmi < 18.5) { bmiCategory = 'Kekurangan Berat Badan'; bmiColor = 'text-amber-400'; }
            else if (bmi >= 23 && bmi < 28) { bmiCategory = 'Kelebihan Berat Badan'; bmiColor = 'text-amber-500'; }
            else if (bmi >= 28) { bmiCategory = 'Obesitas'; bmiColor = 'text-rose-500'; }

            const waterNeeds = Math.round(weight * 35);

            return (
                <div class="space-y-6">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                        <h2 class="text-xl font-extrabold text-white mb-1">Profil & Kalkulator Kebugaran AhmdFIT</h2>
                        <p class="text-xs text-slate-400">Atur parameter tubuh dan lihat kalkulasi indeks massa tubuh (BMI).</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <form onSubmit={handleSave} class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4">
                            <h3 class="text-sm font-bold text-white">Data Diri & Fisik</h3>

                            <div>
                                <label class="text-xs text-slate-400 mb-1 block">Nama Pengguna</label>
                                <input 
                                    type="text" 
                                    value={name} 
                                    onChange={(e) => setName(e.target.value)}
                                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                                />
                            </div>

                            <div class="grid grid-cols-3 gap-3">
                                <div>
                                    <label class="text-xs text-slate-400 mb-1 block">Berat (kg)</label>
                                    <input 
                                        type="number" 
                                        value={weight} 
                                        onChange={(e) => setWeight(e.target.value)}
                                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                                    />
                                </div>
                                <div>
                                    <label class="text-xs text-slate-400 mb-1 block">Tinggi (cm)</label>
                                    <input 
                                        type="number" 
                                        value={height} 
                                        onChange={(e) => setHeight(e.target.value)}
                                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                                    />
                                </div>
                                <div>
                                    <label class="text-xs text-slate-400 mb-1 block">Usia</label>
                                    <input 
                                        type="number" 
                                        value={age} 
                                        onChange={(e) => setAge(e.target.value)}
                                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                                    />
                                </div>
                            </div>

                            <div>
                                <label class="text-xs text-slate-400 mb-1 block">Target Kalori Harian (kcal)</label>
                                <input 
                                    type="number" 
                                    value={targetCalories} 
                                    onChange={(e) => setTargetCalories(e.target.value)}
                                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                                />
                            </div>

                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-sm transition">
                                Simpan Perubahan Profil
                            </button>
                        </form>

                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-6">
                            <h3 class="text-sm font-bold text-white">Analisis Kesehatan Otomatis</h3>

                            <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-2">
                                <span class="text-xs text-slate-400">Indeks Massa Tubuh (BMI)</span>
                                <div class="flex items-baseline gap-3">
                                    <span class="text-3xl font-black text-white">{bmi}</span>
                                    <span class={`text-sm font-bold ${bmiColor}`}>{bmiCategory}</span>
                                </div>
                                <p class="text-[11px] text-slate-500">Kategori standar kesehatan Asia-Pasifik.</p>
                            </div>

                            <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-2">
                                <span class="text-xs text-slate-400">Rekomendasi Air Minum Harian</span>
                                <div class="flex items-baseline gap-2">
                                    <span class="text-2xl font-black text-cyan-400">{waterNeeds}</span>
                                    <span class="text-xs text-slate-400">ml / hari (~{Math.round(waterNeeds / 250)} gelas)</span>
                                </div>
                                <p class="text-[11px] text-slate-500">Minum air yang cukup untuk mencegah dehidrasi saat berolahraga.</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function WorkoutPlayerModal({ exercise, onClose, onComplete }) {
            const [timeLeft, setTimeLeft] = React.useState(exercise.duration || 30);
            const [isRunning, setIsRunning] = React.useState(false);

            React.useEffect(() => {
                let timer;
                if (isRunning && timeLeft > 0) {
                    timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                playBeep(900, 0.4, 'sine');
                                return 0;
                            }
                            if (prev <= 4) playBeep(440, 0.1, 'sine');
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [isRunning, timeLeft]);

            return (
                <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-5 text-center overflow-hidden">
                        
                        <div class="relative h-44 -mx-6 -mt-6 bg-slate-950 mb-2 overflow-hidden">
                            <ExerciseImage src={exercise.image} category={exercise.category} alt={exercise.name} className="w-full h-full object-cover" />
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/40 to-transparent"></div>
                            
                            <span class="absolute top-4 left-4 text-xs font-bold uppercase tracking-wider text-blue-400 px-3 py-1 rounded-full bg-slate-950/80 backdrop-blur-md border border-blue-500/30">
                                {exercise.category || 'AhmdFIT Session'}
                            </span>
                        </div>

                        <div>
                            <h3 class="text-2xl font-black text-white">{exercise.name}</h3>
                            <p class="text-xs text-slate-400 mt-1 leading-relaxed">{exercise.desc}</p>
                        </div>

                        <div class="w-40 h-40 rounded-full bg-slate-950 border-4 border-blue-500/40 flex flex-col items-center justify-center mx-auto shadow-inner shadow-blue-500/20">
                            <span class="text-4xl font-black text-blue-400 font-mono">{timeLeft}s</span>
                            <span class="text-[11px] text-slate-400 mt-1 font-medium">
                                {exercise.reps ? `${exercise.sets} Set × ${exercise.reps} Reps` : 'Hitungan Mundur'}
                            </span>
                        </div>

                        <div class="flex items-center justify-center gap-3">
                            <button 
                                onClick={() => setIsRunning(!isRunning)}
                                class={`px-6 py-3 rounded-2xl font-bold text-sm transition flex items-center gap-2 shadow-lg ${isRunning ? 'bg-amber-500 text-slate-950' : 'bg-blue-600 text-white hover:bg-blue-500'}`}
                            >
                                <i data-lucide={isRunning ? 'pause' : 'play'} class="w-4 h-4"></i>
                                {isRunning ? 'Jeda' : 'Mulai Timer'}
                            </button>

                            <button 
                                onClick={() => { setTimeLeft(exercise.duration || 30); setIsRunning(false); }}
                                class="p-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl transition"
                                title="Reset"
                            >
                                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <div class="pt-4 border-t border-slate-800 flex items-center justify-between">
                            <button 
                                onClick={onClose}
                                class="text-xs text-slate-400 hover:text-white transition font-semibold"
                            >
                                Tutup
                            </button>
                            <button 
                                onClick={onComplete}
                                class="bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
                            >
                                <i data-lucide="check" class="w-4 h-4"></i>
                                Selesai Gerakan Ini
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
