        // Web Audio API Beep Generator for Timers and Reminders
        const playBeep = (freq = 600, duration = 0.15, type = 'sine') => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio play blocked or not supported", e);
            }
        };

        // Component to safely render Exercise Image with Fallback
        function ExerciseImage({ src, category, alt, className = "w-full h-full object-cover" }) {
            const fallbackSrc = CATEGORY_IMAGES[category] || CATEGORY_IMAGES['Kardio'];
            const [imgSrc, setImgSrc] = React.useState(src || fallbackSrc);

            React.useEffect(() => {
                setImgSrc(src || fallbackSrc);
            }, [src, category]);

            return (
                <img 
                    src={imgSrc} 
                    alt={alt || "Ilustrasi Olahraga"} 
                    onError={() => setImgSrc(fallbackSrc)} 
                    class={className}
                    loading="lazy"
                />
            );
        }

        function App() {
            // Active Tab State
            const [activeTab, setActiveTab] = React.useState('dashboard');

            // User Customization / Wizard State
            const [userProfile, setUserProfile] = React.useState(() => {
                const saved = localStorage.getItem('fit_user_profile');
                return saved ? JSON.parse(saved) : {
                    name: 'Sobat Fit',
                    age: 25,
                    weight: 68, // kg
                    height: 170, // cm
                    goal: 'diet_fat_loss',
                    level: 'Pemula',
                    targetWater: 2500 // ml
                };
            });

            // Checklist / Daily Plan State
            const [todayChecklist, setTodayChecklist] = React.useState(() => {
                const saved = localStorage.getItem('fit_today_checklist');
                if (saved) return JSON.parse(saved);
                // Default load diet program
                return PRESET_PROGRAMS[0].exercises.map(ex => ({ ...ex, completed: false }));
            });

            // Active Workout Player Modal
            const [activePlayer, setActivePlayer] = React.useState(null);

            // Reminders Alarms State
            const [reminders, setReminders] = React.useState(() => {
                const saved = localStorage.getItem('fit_reminders');
                return saved ? JSON.parse(saved) : [
                    { id: '1', title: 'Lari Pagi / Cardio', time: '06:00', days: ['Senin', 'Rabu', 'Jumat'], active: true, note: 'Gunakan sepatu lari dan siapkan air minum!' },
                    { id: '2', title: 'Sesi Beban / Push-Up', time: '17:00', days: ['Selasa', 'Kamis', 'Sabtu'], active: true, note: 'Lakukan pemanasan 5 menit sebelum latihan.' }
                ];
            });

            // Progress History Logs
            const [workoutHistory, setWorkoutHistory] = React.useState(() => {
                const saved = localStorage.getItem('fit_history');
                return saved ? JSON.parse(saved) : [
                    { date: '2026-07-25', calories: 240, durationMinutes: 30, completedCount: 5 },
                    { date: '2026-07-26', calories: 310, durationMinutes: 40, completedCount: 6 },
                    { date: '2026-07-27', calories: 180, durationMinutes: 25, completedCount: 4 }
                ];
            });

            // Weight Log Tracker
            const [weightLogs, setWeightLogs] = React.useState(() => {
                const saved = localStorage.getItem('fit_weight_logs');
                return saved ? JSON.parse(saved) : [
                    { date: '2026-07-01', weight: 70.5 },
                    { date: '2026-07-15', weight: 69.2 },
                    { date: '2026-07-28', weight: 68.0 }
                ];
            });

            // Streak Counter
            const [streak, setStreak] = React.useState(5);

            // Save state updates to LocalStorage
            React.useEffect(() => {
                localStorage.setItem('fit_user_profile', JSON.stringify(userProfile));
            }, [userProfile]);

            React.useEffect(() => {
                localStorage.setItem('fit_today_checklist', JSON.stringify(todayChecklist));
            }, [todayChecklist]);

            React.useEffect(() => {
                localStorage.setItem('fit_reminders', JSON.stringify(reminders));
            }, [reminders]);

            React.useEffect(() => {
                localStorage.setItem('fit_history', JSON.stringify(workoutHistory));
            }, [workoutHistory]);

            React.useEffect(() => {
                localStorage.setItem('fit_weight_logs', JSON.stringify(weightLogs));
            }, [weightLogs]);

            // Icons initial render helper
            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Timer check for Reminders
            React.useEffect(() => {
                const interval = setInterval(() => {
                    const now = new Date();
                    const currentHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                    const seconds = now.getSeconds();

                    if (seconds === 0) {
                        reminders.forEach(rem => {
                            if (rem.active && rem.time === currentHM) {
                                playBeep(880, 0.5, 'triangle');
                                triggerNotification(rem.title, rem.note);
                            }
                        });
                    }
                }, 1000);
                return () => clearInterval(interval);
            }, [reminders]);

            // Trigger Browser Notification
            const triggerNotification = (title, body) => {
                if ("Notification" in window) {
                    if (Notification.permission === "granted") {
                        new Notification(`⏰ Waktunya Olahraga: ${title}`, { body, icon: 'https://cdn-icons-png.flaticon.com/512/2964/2964514.png' });
                    } else if (Notification.permission !== "denied") {
                        Notification.requestPermission().then(permission => {
                            if (permission === "granted") {
                                new Notification(`⏰ Waktunya Olahraga: ${title}`, { body });
                            }
                        });
                    }
                }
            };

            // Toggle Checklist item
            const toggleChecklistItem = (id) => {
                setTodayChecklist(prev => {
                    const updated = prev.map(item => item.id === id ? { ...item, completed: !item.completed } : item);
                    playBeep(520, 0.1, 'sine');
                    return updated;
                });
            };

            // Select Preset Routine
            const applyPresetProgram = (programId) => {
                const selected = PRESET_PROGRAMS.find(p => p.id === programId);
                if (selected) {
                    setTodayChecklist(selected.exercises.map(ex => ({ ...ex, completed: false })));
                    setUserProfile(prev => ({ ...prev, goal: programId }));
                    playBeep(700, 0.2, 'sine');
                    alert(`Program "${selected.title}" berhasil dimuat ke Checklist Harian Anda!`);
                }
            };

            const totalItems = todayChecklist.length;
            const completedItems = todayChecklist.filter(i => i.completed).length;
            const progressPercent = totalItems > 0 ? Math.round((completedItems / totalItems) * 100) : 0;
            const totalEstCalories = todayChecklist.filter(i => i.completed).reduce((acc, curr) => acc + (curr.calories || 20), 0);

            const logWorkoutCompletion = () => {
                const todayStr = new Date().toISOString().split('T')[0];
                const existingIdx = workoutHistory.findIndex(h => h.date === todayStr);

                if (existingIdx >= 0) {
                    const updated = [...workoutHistory];
                    updated[existingIdx] = {
                        date: todayStr,
                        calories: totalEstCalories,
                        durationMinutes: completedItems * 5,
                        completedCount: completedItems
                    };
                    setWorkoutHistory(updated);
                } else {
                    setWorkoutHistory(prev => [...prev, {
                        date: todayStr,
                        calories: totalEstCalories,
                        durationMinutes: completedItems * 5,
                        completedCount: completedItems
                    }]);
                }

                if (window.confetti) {
                    window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }
            };

                                    <i data-lucide="activity" class="w-6 h-6"></i>
                                </div>
                                <div>

                                    <p class="text-xs text-emerald-400 font-medium mt-1">Pengingat & Checklist</p>
                                </div>
                            </div>

                            {/* User Quick Info */}
                            <div class="bg-slate-800/60 rounded-2xl p-3.5 mb-6 border border-slate-700/50 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold">
                                    {userProfile.name.charAt(0)}
                                </div>
                                <div class="overflow-hidden">
                                    <p class="text-sm font-bold text-white truncate">{userProfile.name}</p>
                                    <p class="text-xs text-slate-400">{userProfile.weight} kg • Goal: {userProfile.goal === 'diet_fat_loss' ? 'Diet' : userProfile.goal === 'muscle_building' ? 'Massa Otot' : 'Lari'}</p>
                                </div>
                            </div>

                            {/* Navigation Links */}

                                <button 
                                    onClick={() => setActiveTab('dashboard')} 
                                    class={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition-all duration-200 ${activeTab === 'dashboard' ? 'bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/25' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}`}
                                >
                                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                                    <span>Beranda</span>
                                </button>

                                        {prog.exercises.map((ex) => (
                                            <li key={ex.id} class="text-xs text-slate-300 flex items-center gap-3 bg-slate-800/40 p-2 rounded-xl border border-slate-800">
                                                <div class="w-10 h-10 rounded-lg overflow-hidden bg-slate-950 shrink-0 border border-slate-700">
                                                    <ExerciseImage src={ex.image} category={ex.category} alt={ex.name} />
                                                </div>
                                                <div class="flex-1 truncate">
                                                    <p class="font-medium truncate text-white">{ex.name}</p>
                                                    <p class="text-[10px] text-slate-400 font-mono">
                                                        {ex.reps ? `${ex.sets}x${ex.reps} reps` : `${ex.duration} detik`}
                                                    </p>
                                                </div>
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                <button 
                                    onClick={() => applyPresetProgram(prog.id)}
                                    class={`w-full py-3 rounded-2xl font-bold text-sm transition flex items-center justify-center gap-2 ${activeGoal === prog.id ? 'bg-emerald-500 text-slate-950 hover:bg-emerald-400' : 'bg-slate-800 text-white hover:bg-slate-700'}`}
                                >
                                    <i data-lucide="download" class="w-4 h-4"></i>
                                    Gunakan Program Ini
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function RemindersView({ reminders, setReminders, triggerNotification }) {
            const [time, setTime] = React.useState('06:30');
            const [title, setTitle] = React.useState('');
            const [note, setNote] = React.useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if (!title.trim()) return;
                const newRem = {
                    id: 'rem_' + Date.now(),
                    title,
                    time,
                    days: ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'],
                    active: true,
                    note: note || 'Waktunya olahraga harian!'
                };
                setReminders(prev => [...prev, newRem]);
                setTitle('');
                setNote('');
                playBeep(800, 0.2, 'sine');
            };

            const toggleActive = (id) => {
                setReminders(prev => prev.map(r => r.id === id ? { ...r, active: !r.active } : r));
            };

            const deleteReminder = (id) => {
                setReminders(prev => prev.filter(r => r.id !== id));
            };

            return (
                <div class="space-y-6">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                        <h2 class="text-xl font-extrabold text-white mb-1">Pengingat & Alarm Olahraga</h2>
                        <p class="text-xs text-slate-400">Atur jadwal alarm otomatis agar kamu tidak pernah melewatkan waktu latihan.</p>
                    </div>

                    {/* Request Permission Banner */}
                    <div class="bg-gradient-to-r from-cyan-900/40 to-slate-900 border border-cyan-800/50 p-4 rounded-2xl flex items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <i data-lucide="bell-ring" class="w-5 h-5 text-cyan-400"></i>
                            <div>
                                <p class="text-sm font-bold text-white">Izin Notifikasi Browser</p>
                                <p class="text-xs text-slate-400">Aktifkan notifikasi untuk menerima pengingat secara otomatis saat browser terbuka.</p>
                            </div>
                        </div>
                        <button 
                            onClick={() => triggerNotification("Tes Pengingat", "Notifikasi aktif sempurna!")}
                            class="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs shrink-0 transition"
                        >
                            Tes Notifikasi
                        </button>
                    </div>

                    {/* Add Reminder Form */}
                    <form onSubmit={handleAdd} class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4">
                        <h3 class="text-sm font-bold text-white">Tambah Jadwal Pengingat Baru</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div>
                                <label class="text-xs text-slate-400 mb-1 block">Waktu Alarm</label>
                                <input 
                                    type="time" 
                                    value={time}
                                    onChange={(e) => setTime(e.target.value)}
                                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                                />
                            </div>
                            <div>
                                <label class="text-xs text-slate-400 mb-1 block">Nama Sesi Olahraga</label>
                                <input 
                                    type="text" 
                                    placeholder="Contoh: Jogging Pagi" 
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500"
                                />
                            </div>
                            <div>
                                <label class="text-xs text-slate-400 mb-1 block">Catatan Tambahan</label>
                                <input 
                                    type="text" 
                                    placeholder="Contoh: Minum air putih hangat" 
                                    value={note}
                                    onChange={(e) => setNote(e.target.value)}
                                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500"
                                />
                            </div>
                        </div>
                        <button 
                            type="submit"
                            class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2"
                        >
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            Simpan Pengingat
                        </button>
                    </form>

                    {/* List of Reminders */}
                    <div class="space-y-3">
                        {reminders.map((rem) => (
                            <div key={rem.id} class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex items-center justify-between gap-4">
                                <div class="flex items-center gap-4">
                                    <div class="text-2xl font-black text-emerald-400 font-mono bg-slate-950 px-3 py-2 rounded-xl border border-slate-800">
                                        {rem.time}
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-white text-base">{rem.title}</h4>
                                        <p class="text-xs text-slate-400">{rem.note}</p>
                                    </div>
                                </div>

                                <div class="flex items-center gap-3">
                                    <button 
                                        onClick={() => toggleActive(rem.id)}
                                        class={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${rem.active ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-slate-800 text-slate-500'}`}
                                    >
                                        {rem.active ? 'Aktif' : 'Mati'}
                                    </button>
                                    <button 
                                        onClick={() => deleteReminder(rem.id)}
                                        class="p-2 text-slate-500 hover:text-rose-400 transition"
                                    >
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function ProgressAnalyticsView({ workoutHistory, weightLogs, setWeightLogs, userProfile }) {
            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);

            const [newWeight, setNewWeight] = React.useState('');

            // Render Chart.js
            React.useEffect(() => {
                if (!chartRef.current) return;

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: workoutHistory.map(h => h.date),
                        datasets: [{
                            label: 'Kalori Terbakar (kcal)',
                            data: workoutHistory.map(h => h.calories),
                            backgroundColor: '#22c55e',
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { labels: { color: '#94a3b8' } }
                        },
                        scales: {
                            x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
                            y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [workoutHistory]);

            const handleAddWeight = (e) => {
                e.preventDefault();
                if (!newWeight || isNaN(newWeight)) return;
                const todayStr = new Date().toISOString().split('T')[0];
                setWeightLogs(prev => [...prev, { date: todayStr, weight: parseFloat(newWeight) }]);
                setNewWeight('');
            };

            return (
                <div class="space-y-6">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                        <h2 class="text-xl font-extrabold text-white mb-1">Hasil Progres & Statistik</h2>
                        <p class="text-xs text-slate-400">Pantau perkembangan latihan harian dan riwayat perubahan berat badanmu.</p>
                    </div>

                    {/* Chart Container */}
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4">
                        <h3 class="text-sm font-bold text-white">Grafik Kalori Terbakar Per Sesi</h3>
                        <div class="w-full h-64">
                            <canvas ref={chartRef}></canvas>
                        </div>
                    </div>

                    {/* Weight Tracker Section */}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4">
                            <h3 class="text-sm font-bold text-white">Catat Berat Badan Terbaru</h3>
                            <form onSubmit={handleAddWeight} class="flex gap-2">
                                <input 
                                    type="number" 
                                    step="0.1"
                                    placeholder="Berat (kg)..."
                                    value={newWeight}
                                    onChange={(e) => setNewWeight(e.target.value)}
                                    class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                                />
                                <button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-sm transition">
                                    Simpan Log
                                </button>
                            </form>

                            <div class="space-y-2 mt-4 max-h-48 overflow-y-auto">
                                {weightLogs.slice().reverse().map((log, idx) => (
                                    <div key={idx} class="flex justify-between items-center text-xs p-3 bg-slate-950 rounded-xl border border-slate-800">
                                        <span class="text-slate-400">{log.date}</span>
                                        <span class="font-bold text-white">{log.weight} kg</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Summary Badges */}
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 flex flex-col justify-between">
                            <div>
                                <h3 class="text-sm font-bold text-white mb-2">Pencapaian & Milestone</h3>
                                <p class="text-xs text-slate-400">Setiap sesi latihan mendekatkanmu ke versi terbaik dirimu!</p>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 text-center">
                                    <i data-lucide="trophy" class="w-6 h-6 text-amber-400 mx-auto mb-1"></i>
                                    <p class="text-lg font-black text-white">{workoutHistory.length}</p>
                                    <p class="text-[11px] text-slate-400">Sesi Latihan Selesai</p>
                                </div>
                                <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 text-center">
                                    <i data-lucide="flame" class="w-6 h-6 text-rose-500 mx-auto mb-1"></i>
                                    <p class="text-lg font-black text-white">
                                        {workoutHistory.reduce((acc, curr) => acc + (curr.calories || 0), 0)}
                                    </p>
                                    <p class="text-[11px] text-slate-400">Total Kalori Terbakar</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ProfileCalculatorView({ userProfile, setUserProfile }) {
            const [name, setName] = React.useState(userProfile.name);
            const [weight, setWeight] = React.useState(userProfile.weight);
            const [height, setHeight] = React.useState(userProfile.height);
            const [age, setAge] = React.useState(userProfile.age);

            const handleSave = (e) => {
                e.preventDefault();
                setUserProfile(prev => ({
                    ...prev,
                    name,
                    weight: parseFloat(weight),
                    height: parseFloat(height),
                    age: parseInt(age)
                }));
                playBeep(700, 0.15, 'sine');
                alert('Profil berhasil diperbarui!');
            };

            // Calculate BMI
            const heightInMeters = height / 100;
            const bmi = heightInMeters > 0 ? (weight / (heightInMeters * heightInMeters)).toFixed(1) : 0;

            let bmiCategory = 'Normal';
            let bmiColor = 'text-emerald-400';
            if (bmi < 18.5) { bmiCategory = 'Kekurangan Berat Badan'; bmiColor = 'text-amber-400'; }
            else if (bmi >= 23 && bmi < 28) { bmiCategory = 'Kelebihan Berat Badan'; bmiColor = 'text-amber-500'; }
            else if (bmi >= 28) { bmiCategory = 'Obesitas'; bmiColor = 'text-rose-500'; }

            // Estimate Daily Water Requirement
            const waterNeeds = Math.round(weight * 35); // ml

            return (
                <div class="space-y-6">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                        <h2 class="text-xl font-extrabold text-white mb-1">Profil & Kalkulator Kebugaran</h2>
                        <p class="text-xs text-slate-400">Atur parameter tubuh dan lihat kalkulasi indeks massa tubuh (BMI).</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Profile Form */}
                        <form onSubmit={handleSave} class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4">
                            <h3 class="text-sm font-bold text-white">Data Diri & Fisik</h3>

                            <div>
                                <label class="text-xs text-slate-400 mb-1 block">Nama Panggilan</label>
                                <input 
                                    type="text" 
                                    value={name} 
                                    onChange={(e) => setName(e.target.value)}
                                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                                />
                            </div>

                            <div class="grid grid-cols-3 gap-3">
                                <div>
                                    <label class="text-xs text-slate-400 mb-1 block">Berat (kg)</label>
                                    <input 
                                        type="number" 
                                        value={weight} 
                                        onChange={(e) => setWeight(e.target.value)}
                                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                                    />
                                </div>
                                <div>
                                    <label class="text-xs text-slate-400 mb-1 block">Tinggi (cm)</label>
                                    <input 
                                        type="number" 
                                        value={height} 
                                        onChange={(e) => setHeight(e.target.value)}
                                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                                    />
                                </div>
                                <div>
                                    <label class="text-xs text-slate-400 mb-1 block">Usia</label>
                                    <input 
                                        type="number" 
                                        value={age} 
                                        onChange={(e) => setAge(e.target.value)}
                                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                                    />
                                </div>
                            </div>

                            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition">
                                Simpan Perubahan
                            </button>
                        </form>

                        {/* Health Calculations */}
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-6">
                            <h3 class="text-sm font-bold text-white">Analisis Kesehatan Otomatis</h3>

                            <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-2">
                                <span class="text-xs text-slate-400">Indeks Massa Tubuh (BMI)</span>
                                <div class="flex items-baseline gap-3">
                                    <span class="text-3xl font-black text-white">{bmi}</span>
                                    <span class={`text-sm font-bold ${bmiColor}`}>{bmiCategory}</span>
                                </div>
                                <p class="text-[11px] text-slate-500">Kategori standar kesehatan Asia-Pasifik.</p>
                            </div>

                            <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-2">
                                <span class="text-xs text-slate-400">Rekomendasi Air Minum Harian</span>
                                <div class="flex items-baseline gap-2">
                                    <span class="text-2xl font-black text-cyan-400">{waterNeeds}</span>
                                    <span class="text-xs text-slate-400">ml / hari (~{Math.round(waterNeeds / 250)} gelas)</span>
                                </div>
                                <p class="text-[11px] text-slate-500">Minum air yang cukup untuk mencegah dehidrasi saat berolahraga.</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function WorkoutPlayerModal({ exercise, onClose, onComplete }) {
            const [timeLeft, setTimeLeft] = React.useState(exercise.duration || 30);
            const [isRunning, setIsRunning] = React.useState(false);

            React.useEffect(() => {
                let timer;
                if (isRunning && timeLeft > 0) {
                    timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                playBeep(900, 0.4, 'sine');
                                return 0;
                            }
                            if (prev <= 4) playBeep(440, 0.1, 'sine');
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [isRunning, timeLeft]);

            return (
                <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-5 text-center overflow-hidden">
                        
                        {/* Visual Exercise Banner */}
                        <div class="relative h-44 -mx-6 -mt-6 bg-slate-950 mb-2 overflow-hidden">
                            <ExerciseImage src={exercise.image} category={exercise.category} alt={exercise.name} className="w-full h-full object-cover" />
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/40 to-transparent"></div>
                            
                            <span class="absolute top-4 left-4 text-xs font-bold uppercase tracking-wider text-emerald-400 px-3 py-1 rounded-full bg-slate-950/80 backdrop-blur-md border border-emerald-500/30">
                                {exercise.category || 'Sesi Terpandu'}
                            </span>
                        </div>

                        <div>
                            <h3 class="text-2xl font-black text-white">{exercise.name}</h3>
                            <p class="text-xs text-slate-400 mt-1 leading-relaxed">{exercise.desc}</p>
                        </div>

                        {/* Large Timer / Counter display */}
                        <div class="w-40 h-40 rounded-full bg-slate-950 border-4 border-emerald-500/40 flex flex-col items-center justify-center mx-auto shadow-inner shadow-emerald-500/20">
                            <span class="text-4xl font-black text-emerald-400 font-mono">{timeLeft}s</span>
                            <span class="text-[11px] text-slate-400 mt-1 font-medium">
                                {exercise.reps ? `${exercise.sets} Set × ${exercise.reps} Reps` : 'Hitungan Mundur'}
                            </span>
                        </div>

                        {/* Controls */}
                        <div class="flex items-center justify-center gap-3">
                            <button 
                                onClick={() => setIsRunning(!isRunning)}
                                class={`px-6 py-3 rounded-2xl font-bold text-sm transition flex items-center gap-2 shadow-lg ${isRunning ? 'bg-amber-500 text-slate-950' : 'bg-emerald-500 text-slate-950 hover:bg-emerald-400'}`}
                            >
                                <i data-lucide={isRunning ? 'pause' : 'play'} class="w-4 h-4"></i>
                                {isRunning ? 'Jeda' : 'Mulai Timer'}
                            </button>

                            <button 
                                onClick={() => { setTimeLeft(exercise.duration || 30); setIsRunning(false); }}
                                class="p-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl transition"
                                title="Reset"
                            >
                                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <div class="pt-4 border-t border-slate-800 flex items-center justify-between">
                            <button 
                                onClick={onClose}
                                class="text-xs text-slate-400 hover:text-white transition font-semibold"
                            >
                                Tutup
                            </button>
                            <button 
                                onClick={onComplete}
                                class="bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500 hover:text-slate-950 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
                            >
                                <i data-lucide="check" class="w-4 h-4"></i>
                                Selesai Gerakan Ini
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
